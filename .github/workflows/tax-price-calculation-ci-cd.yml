name: Build & Deploy Microservices

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build Tax Service (using explicit path to pom.xml)
      - name: Build Tax Service
        run: mvn clean package -DskipTests -f microservices-tax-price-calculation/tax-service/pom.xml

      # 4. Build Price Service (using explicit path to pom.xml)
      - name: Build Price Service
        run: mvn clean package -DskipTests -f microservices-tax-price-calculation/price-service/pom.xml

      # 5. Docker Login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build & Push Tax Image
      - name: Build & Push Tax Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tax-service-image:latest ./microservices-tax-price-calculation/tax-service
          docker push ${{ secrets.DOCKER_USERNAME }}/tax-service-image:latest

      # 7. Build & Push Price Image
      - name: Build & Push Price Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/price-service-image:latest ./microservices-tax-price-calculation/price-service
          docker push ${{ secrets.DOCKER_USERNAME }}/price-service-image:latest

      # 8. Setup kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      # 9. Deploy to K8s
      - name: Deploy to K8s
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          # Handles both raw text and base64 encoded kubeconfig
          echo "$KUBECONFIG_DATA" | base64 --decode > ~/.kube/config 2>/dev/null || echo "$KUBECONFIG_DATA" > ~/.kube/config
          
          # Deploying specific folders
          kubectl apply -f k8s/aws/microservices-tax-price-calculation/tax-service/
          kubectl apply -f k8s/aws/microservices-tax-price-calculation/price-service/
          
          # Restart deployments to pull new 'latest' images
          kubectl rollout restart deployment/tax-deployment || echo "Tax deployment not found"
          kubectl rollout restart deployment/price-deployment || echo "Price deployment not found"
