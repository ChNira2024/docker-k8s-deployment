name: Build & Deploy Microservices

on:
  push:
    branches:
      - main
    paths:
      - 'microservices-tax-price-calculation/**'
      - 'k8s/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build Tax Service
      # Note: Removed the redundant /tax-service/tax-service path
      - name: Build Tax Service
        working-directory: ./microservices-tax-price-calculation/tax-service
        run: mvn clean package -DskipTests

      # 4. Build Price Service
      - name: Build Price Service
        working-directory: ./microservices-tax-price-calculation/price-service
        run: mvn clean package -DskipTests

      # 5. Docker Login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build & Push Tax Image
      - name: Build & Push Tax Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tax-service-image:latest ./microservices-tax-price-calculation/tax-service
          docker push ${{ secrets.DOCKER_USERNAME }}/tax-service-image:latest

      # 7. Build & Push Price Image
      - name: Build & Push Price Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/price-service-image:latest ./microservices-tax-price-calculation/price-service
          docker push ${{ secrets.DOCKER_USERNAME }}/price-service-image:latest

      # 8. Setup kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      # 9. Set kubeconfig & Deploy
      # Using a more secure method to handle the kubeconfig file
      - name: Deploy to K8s
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" > ~/.kube/config
          
          # Deploying services one by one based on your folder structure
          kubectl apply -f k8s/aws/microservices-tax-price-calculation/tax-service/
          kubectl apply -f k8s/aws/microservices-tax-price-calculation/price-service/
          
          # Optional: Force a rollout restart to pick up the latest 'latest' tag
          kubectl rollout restart deployment/tax-deployment
          kubectl rollout restart deployment/price-deployment
