name: Build & Deploy Microservices

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Java setup
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Build Tax Service
      - name: Build Tax Service
        run: |
          cd tax-service
          mvn clean package -DskipTests

      # 4. Build Price Service
      - name: Build Price Service
        run: |
          cd price-service
          mvn clean package -DskipTests

      # 5. Docker login
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build & Push Tax Image
      - name: Build & Push Tax Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tax-service-image:1.0 ./tax-service
          docker push ${{ secrets.DOCKER_USERNAME }}/tax-service-image:1.0

      # 7. Build & Push Price Image
      - name: Build & Push Price Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/price-service-image:1.0 ./price-service
          docker push ${{ secrets.DOCKER_USERNAME }}/price-service-image:1.0

      # 8. Setup kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      # 9. Set kubeconfig (VERY IMPORTANT)
      - name: Set kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      # 10. Deploy to Kubernetes
      - name: Deploy to K8s
        run: |
          kubectl apply -f k8s/
