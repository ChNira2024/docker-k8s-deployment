name: Build & Deploy Microservices

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Java
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Debug folder structure (VERY IMPORTANT)
      - name: Debug project structure
        run: |
          pwd
          ls -R

      # 4. Build Tax Service
      - name: Build Tax Service
        working-directory: ./microservices-tax-price-calculation/tax-service/tax-service
        run: mvn clean package -DskipTests

      # 5. Build Price Service
      - name: Build Price Service
        working-directory: ./microservices-tax-price-calculation/price-service/price-service
        run: mvn clean package -DskipTests

      # 6. Docker Login
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Build & Push Tax Image
      - name: Build & Push Tax Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tax-service-image:1.0 ./microservices-tax-price-calculation/tax-service
          docker push ${{ secrets.DOCKER_USERNAME }}/tax-service-image:1.0

      # 8. Build & Push Price Image
      - name: Build & Push Price Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/price-service-image:1.0 ./microservices-tax-price-calculation/price-service
          docker push ${{ secrets.DOCKER_USERNAME }}/price-service-image:1.0

      # 9. Setup kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      # 10. Set kubeconfig (ONLY for cloud K8s)
      - name: Set kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      # 11. Deploy to Kubernetes
      - name: Deploy to K8s
        run: |
          kubectl apply -f k8s/aws/microservices-tax-price-calculation/
