name: Tax Price Calculator CI/CD to AWS EKS

on:
  workflow_dispatch

jobs:

  # -------------------------------
  # 1. BUILD & TEST
  # -------------------------------
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tax-service, price-service]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and Test (Maven)
        working-directory: microservices-tax-price-calculation/${{ matrix.service }}
        run: mvn -B clean verify

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: microservices-tax-price-calculation/${{ matrix.service }}/target/surefire-reports


  # -------------------------------
  # 2. DOCKER BUILD & PUSH
  # -------------------------------
  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    strategy:
      matrix:
        service: [tax-service, price-service]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JAR
        working-directory: microservices-tax-price-calculation/${{ matrix.service }}
        run: mvn -B clean package -DskipTests

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: microservices-tax-price-calculation/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest


  # -------------------------------
  # 3. DEPLOY TO AWS EKS
  # -------------------------------
  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name hello-cluster --region ap-south-1

      - name: Verify connection
        run: kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/aws/microservices-tax-price-calculation/tax-service
          kubectl apply -f k8s/aws/microservices-tax-price-calculation/price-service
