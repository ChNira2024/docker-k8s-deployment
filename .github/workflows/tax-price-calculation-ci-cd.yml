name: Tax Price Calculator CI/CD to AWS EKS

on:
  workflow_dispatch

jobs:

  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tax-service, price-service]

    steps:
      # 1. Checkout CI repo (this repo)
      - name: Checkout CI Repo
        uses: actions/checkout@v4

      # 2. Checkout SOURCE CODE repo
      - name: Checkout Source Code Repo
        uses: actions/checkout@v4
        with:
          repository: ChNira2024/microservices-tax-price-calculation
          path: app-code

      # 3. Setup Java
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Build
      - name: Build Service
        working-directory: app-code/${{ matrix.service }}
        run: mvn -B clean verify


  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        service: [tax-service, price-service]

    steps:
      - name: Checkout CI Repo
        uses: actions/checkout@v4

      - name: Checkout Source Code Repo
        uses: actions/checkout@v4
        with:
          repository: ChNira2024/microservices-tax-price-calculation
          path: app-code

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build JAR
        working-directory: app-code/${{ matrix.service }}
        run: mvn -B clean package -DskipTests

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: app-code/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest


  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout CI Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name hello-cluster --region ap-south-1

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/aws/microservices-tax-price-calculation/tax-service
          kubectl apply -f k8s/aws/microservices-tax-price-calculation/price-service
