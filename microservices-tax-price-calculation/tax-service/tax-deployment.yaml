apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tax-service
  template:
    metadata:
      labels:
        app: tax-service
    spec:
      containers:
        - name: tax-service
          image: niranjana1992/tax-service-image:1.1
          ports:
            - containerPort: 4000
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
